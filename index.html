<!DOCTYPE html>
<html lang="ko">
<head>
<meta name="application-version" content="1.2.0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>골드 장부 · Lost Ark</title>
<link rel="icon" href="data:,">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root {
    --bg: #090a0f;
    --panel: #13151f;
    --panel-sub: #1a1d2b;
    --panel-sub-2: #222638;
    --border: #262a3b;
    --border-hover: #3b425b;
    --border-focus: #fbbf24;
    --gold: #fbbf24;
    --gold-deep: #d97706;
    --rust: #fb7185;
    --green: #34d399;
    --cyan: #38bdf8;
    --text: #f8fafc;
    --text-muted: #7e8b9f;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; background-color: var(--bg); }
  body { font-family: 'Noto Sans KR', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 20px 60px; }

  /* 헤더 */
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
  .eyebrow { font-size: 11px; letter-spacing: 0.12em; color: var(--gold); font-family: 'JetBrains Mono', monospace; font-weight: 700; margin-bottom: 4px; }
  .title { font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -0.02em; color: #fff; }
  .base-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text-muted); border-radius: 999px; padding: 7px 14px; font-size: 12px; font-family: 'JetBrains Mono', monospace; cursor: pointer; transition: all 0.2s; }
  .base-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* 뷰 탭 */
  .view-tabs { display: flex; gap: 8px; margin-bottom: 18px; background: var(--panel); padding: 4px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .view-tab { flex: 1; text-align: center; padding: 10px; border:0; background:transparent; font-family:inherit; border-radius: 6px; color: var(--text-muted); cursor: pointer; font-size: 13.5px; font-weight: 600; transition: all 0.2s; }
  .view-tab.active { background: var(--panel-sub-2); color: var(--gold); font-weight: 700; }

  /* 계정 칩 */
  .account-row { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); font-size: 12.5px; color: var(--text-muted); background: var(--panel); cursor: pointer; transition: all 0.2s; }
  .chip:hover { border-color: var(--border-hover); }
  .chip.active { color: #090a0f; background: var(--gold); border-color: var(--gold); font-weight: 700; }
  .chip .pencil { opacity: 0.6; font-size: 11px; padding: 1px 4px; border-radius: 999px; }
  .chip .chip-del { opacity: 0.6; font-size: 13px; padding: 0 2px; border-radius: 999px; }
  .chip.active .pencil, .chip.active .chip-del { opacity: 0.9; }
  .chip-add { width: 30px; height: 30px; border-radius: 50%; border: 1px dashed var(--border-hover); color: var(--text-muted); background: transparent; cursor: pointer; font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .chip-add:hover { border-color: var(--gold); color: var(--gold); }
  .rename-input { width: 76px; background: var(--bg); border: 1px solid #000; border-radius: 4px; color: var(--text); padding: 2px 6px; font-size: 12px; }

  /* 카드 패널 */
  .card-panel { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; }
  .card-header-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; flex-wrap: wrap; gap: 6px; }
  .card-header-label { font-size: 12.5px; color: var(--text-muted); font-weight: 500; }
  .card-header-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); }
  .carry-stamp { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--rust); border: 1px solid var(--rust); border-radius: 999px; padding: 3px 10px; margin-bottom: 14px; background: rgba(251, 113, 133, 0.08); font-weight: 500; }

  /* 스탯 그리드 */
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; text-align: center; }
  .stat-box { background: var(--panel-sub); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 6px; display: flex; flex-direction: column; justify-content: center; }
  .stat-label { font-size: 11.5px; color: var(--text-muted); margin-bottom: 5px; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; word-break: break-all; cursor: pointer; }
  .inline-input { width: 90%; margin: 0 auto; background: var(--bg); border: 1px solid var(--border-focus); border-radius: 4px; color: var(--text); padding: 4px 6px; font-family: 'JetBrains Mono', monospace; font-size: 15px; text-align: center; }

  /* 계정별 분배 */
  .breakdown-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .breakdown-chip { font-size: 11.5px; font-family: 'JetBrains Mono', monospace; color: var(--text-muted); background: var(--panel-sub); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; }
  .breakdown-chip b { color: var(--gold); font-weight: 700; }
  .wallet-summary { padding: 30px; border-radius: 24px; background: #121620; border-color: #29303d; box-shadow: 0 16px 48px rgba(0,0,0,.16); }
  .wallet-summary, .wallet-account, .wallet-section-head { font-family: 'Noto Sans KR', 'Segoe UI', sans-serif; font-variant-numeric: lining-nums tabular-nums; }
  .wallet-summary .card-header-val { font-family: inherit; color: #a6afc0; font-size: 12px; }
  .wallet-total { margin: 20px 0; text-align: left; }
  .wallet-total-label { color: var(--text-muted); font-size: 13px; }
  .wallet-total-value { font-size: clamp(32px, 7vw, 40px); font-weight: 600; color: #f5d58b; letter-spacing: -0.035em; line-height: 1.3; margin: 6px 0 12px; overflow-wrap: anywhere; }
  .wallet-meta { display: flex; flex-wrap: wrap; gap: 8px 20px; color: #a6b1c3; font-size: 12px; }
  .wallet-meta b { color: var(--text); font-weight: 500; }
  .wallet-goals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .wallet-goals .stat-box { min-width: 0; padding: 16px 18px; text-align: left; border-radius: 12px; background: #191e2a; border-color: #2a3140; }
  .wallet-goals .stat-label { font-size: 12px; color: #b1bdd0; margin-bottom: 7px; line-height: 1.5; }
  .wallet-goals .stat-value { font-family: inherit; font-size: 26px; font-weight: 500; line-height: 1.35; letter-spacing: -0.035em; word-break: normal; overflow-wrap: anywhere; }
  .wallet-goals .inline-input { font-family: inherit; font-size: 23px; border-radius: 8px; padding: 6px; }
  .wallet-unit { font-size: .72em; font-weight: 500; margin-left: 1px; letter-spacing: 0; opacity: .9; }
  .wallet-progress { height: 5px; border-radius: 99px; overflow: hidden; background: var(--bg); margin-top: 24px; }
  .wallet-progress .bar-fill { background: #eac477; }
  .wallet-progress-caption { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-muted); margin-top: 8px; }
  .wallet-section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 26px 0 16px; }
  .wallet-section-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .wallet-section-head span { color: var(--text-muted); font-size: 11.5px; }
  .wallet-accounts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-bottom: 24px; }
  .wallet-account { display: grid; grid-template-columns: minmax(0,1fr) minmax(100px,auto); grid-template-rows: auto auto; column-gap: 18px; align-items: center; min-width: 0; padding: 16px 20px; text-align: left; border: 1px solid #293140; border-radius: 14px; background: #141923; transition: border-color .18s ease, background .18s ease; }
  .wallet-account:hover, .wallet-account:focus-within { border-color: #736247; background: #191e28; }
  .wallet-account-name { grid-column: 1; grid-row: 1; font-size: 14px; font-weight: 500; color: #e0e7f2; overflow-wrap: anywhere; }
  .wallet-account-value { grid-column: 2; grid-row: 1 / 3; display: block; width: 100%; min-height: 44px; border: 0; background: transparent; padding: 3px 0 3px 12px; text-align: right; font: inherit; font-size: 28px; line-height: 1.3; letter-spacing: -0.035em; font-weight: 500; color: #f0f3f9; cursor: pointer; }
  .wallet-account-value:hover { color: var(--gold); }
  .wallet-account-value:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 3px; }
  .wallet-account-edit { grid-column: 2; grid-row: 1 / 3; display: flex; align-items: center; justify-content: flex-end; gap: 5px; color: #b1bdd0; }
  .wallet-account .items-target-input { width: 120px; max-width: 100%; min-height: 44px; font: inherit; font-size: 24px; text-align: right; padding: 3px 8px; border-radius: 8px; }
  .wallet-account-note { grid-column: 1; grid-row: 2; font-size: 12px; color: #a6b1c3; margin-top: 5px; line-height: 1.5; }
  .wallet-sales { border-radius: 20px; padding: 24px; }
  .wallet-sales .wallet-section-head { margin-top: 0; }
  .wallet-sales .entry-form { margin-bottom: 8px; }
  .wallet-sales .unit-hint { margin: 0; line-height: 1.6; }
  .wallet-sales .add-btn { background: var(--rust); }
  .wallet-summary { padding: 24px; border-radius: 20px; }
  .wallet-total-label, .wallet-progress-caption, .wallet-section-head span { color: #a6b1c3; }
  .wallet-progress { margin-top: 18px; }
  @media (max-width: 420px) { .wallet-summary { padding: 20px 16px; } .wallet-account { padding: 14px 16px; column-gap: 10px; } .wallet-account-value { font-size: 26px; } .wallet-goals { gap: 10px; } .wallet-goals .stat-box { padding: 14px 12px; } .wallet-goals .stat-value { font-size: 24px; } .wallet-section-head { flex-wrap: wrap; gap: 6px; } .wallet-sales { padding: 20px 16px; } }
  @media (prefers-reduced-motion: reduce) { .wallet-account { transition: none; transform: none !important; } }

  /* 게이지 바 & 인장 */
  .bar-track { position: relative; height: 14px; background: var(--panel-sub); border-radius: 999px; border: 1px solid var(--border); margin-top: 6px; }
  .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); transition: width 0.4s ease; }
  .bar-seal { position: absolute; top: -12px; width: 38px; height: 38px; border-radius: 50%; background: var(--panel-sub-2); border: 2px solid var(--gold); color: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: 'JetBrains Mono', monospace; font-weight: 700; transition: left 0.4s ease; }
  .seal-pop { animation: sealPop 0.5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes sealPop { 0% { transform: scale(1.5); } 60% { transform: scale(0.95); } 100% { transform: scale(1); } }
  .complete-tag { margin-top: 14px; color: var(--green); font-size: 13px; font-weight: 600; text-align: center; }

  /* 골드 입력 폼 */
  .entry-form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .type-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--panel); }
  .type-btn { padding: 10px 14px; background: transparent; color: var(--text-muted); border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
  .type-btn.active { background: var(--gold); color: #090a0f; font-weight: 700; }
  .type-btn.sell.active { background: var(--rust); color: #fff; }
  .select-input { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); padding: 10px 12px; font-size: 13.5px; outline: none; }
  .amount-input { flex: 1 1 140px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); padding: 10px 14px; font-family: 'JetBrains Mono', monospace; font-size: 14px; min-width: 0; outline: none; }
  .amount-input:focus, .select-input:focus { border-color: var(--border-focus); }
  .add-btn { flex: 0 0 auto; background: var(--gold); border: none; color: #090a0f; font-weight: 700; border-radius: var(--radius-sm); padding: 10px 18px; cursor: pointer; font-size: 13.5px; white-space: nowrap; transition: opacity 0.2s; }
  .add-btn:hover { opacity: 0.9; }
  .unit-hint { font-size: 11.5px; color: var(--text-muted); margin: -8px 0 16px 4px; }

  /* 카드값 & 필요 골드 환산 영역 (강조 확대) */
  .card-conversion-box { margin-top: 14px; padding: 16px 18px; background: var(--panel-sub); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .conversion-label { font-size: 13.5px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
  .conversion-value { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700; color: var(--cyan); letter-spacing: -0.01em; line-height: 1.2; }
  .rate-hint { font-size: 12px; color: var(--text-muted); margin-top: 10px; cursor: pointer; text-decoration: underline dotted; display: inline-block; }

  /* 내역 섹션 */
  .entries-section { margin-bottom: 26px; }
  .section-label { font-size: 12.5px; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 600; }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filter-chip { font-size: 12px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; background: var(--panel); }
  .filter-chip.active { color: var(--gold); border-color: var(--gold); background: rgba(251, 191, 36, 0.1); }
  .empty-row { color: var(--text-muted); font-size: 13.5px; padding: 14px 0; text-align: center; border-top: 1px solid var(--border); }
  
  .entry-row { display: grid; grid-template-columns: 46px auto 1fr 24px; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
  .entry-date { color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .entry-account-tag { font-size: 11.5px; color: var(--gold); background: var(--panel-sub); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
  .entry-amount { color: var(--gold); font-family: 'JetBrains Mono', monospace; font-weight: 700; cursor: pointer; text-align: right; font-size: 14px; }
  .entry-amount.sell { color: var(--rust); }
  .entry-edit-input { width: 90px; justify-self: end; background: var(--bg); border: 1px solid var(--gold); border-radius: 4px; color: var(--text); padding: 4px 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: right; }
  .del-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; line-height: 1; text-align: right; transition: color 0.2s; }
  .del-btn:hover { color: var(--rust); }

  /* 히스토리 섹션 */
  .history-section { margin-bottom: 20px; }
  .history-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .history-period { font-size: 12.5px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; min-width: 130px; }
  .history-nums { display: flex; gap: 12px; font-size: 12.5px; font-family: 'JetBrains Mono', monospace; }
  .badge { font-size: 11.5px; border-radius: 999px; padding: 3px 10px; font-family: 'JetBrains Mono', monospace; font-weight: 600; white-space: nowrap; }
  .badge-ok { color: var(--green); border: 1px solid var(--green); background: rgba(52, 211, 153, 0.08); }
  .badge-miss { color: var(--rust); border: 1px solid var(--rust); background: rgba(251, 113, 133, 0.08); }
  .more-btn { width: 100%; margin-top: 12px; background: transparent; border: 1px dashed var(--border); color: var(--text-muted); border-radius: var(--radius-sm); padding: 9px 0; cursor: pointer; font-size: 12.5px; }

  /* 아이템 계산기 */
  .items-summary-box { padding: 16px; background: var(--panel-sub); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 16px; }
  .items-summary-label { font-size: 12.5px; color: var(--text-muted); margin-bottom: 4px; }
  .items-summary-value { font-size: 22px; font-weight: 700; color: var(--gold); }
  .items-target-input { width: 150px; background: var(--bg); border: 1px solid var(--gold); border-radius: 6px; color: var(--text); padding: 7px 9px; font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: right; outline: none; }
  .items-target-value { color: var(--gold); cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; }
  .goal-summary-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; margin-top: 12px; color: var(--text-muted); font-size: 12px; }
  .goal-summary-line .goal-amount { color: var(--text); font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .goal-summary-line .goal-remaining { color: var(--gold); font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; }
  .goal-progress-track { height: 6px; margin-top: 8px; overflow: hidden; background: var(--bg); border-radius: 999px; }
  .goal-progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); border-radius: inherit; transition: width 0.3s ease; }
  .items-needed-box { margin: 14px 0 16px; padding: 14px; background: var(--panel-sub); border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .items-needed-title { font-size: 12.5px; font-weight: 700; margin-bottom: 10px; }
  .items-needed-row { display: grid; grid-template-columns: minmax(0, 1fr) 82px 100px 100px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
  .items-needed-row:first-of-type { border-top: none; }
  .items-needed-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .items-needed-num { font-family: 'JetBrains Mono', monospace; text-align: right; white-space: nowrap; }
  .items-needed-positive { color: var(--gold); font-weight: 700; }
  .item-list-head { display: grid; grid-template-columns: 1fr 74px 68px 100px 24px; gap: 8px; font-size: 11px; color: var(--text-muted); padding: 8px 0; border-bottom: 1px solid var(--border); }
  .item-row { display: grid; grid-template-columns: 1fr 74px 68px 100px 24px; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 13.5px; }
  .item-name { color: var(--text); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-price { font-family: 'JetBrains Mono', monospace; color: var(--text-muted); cursor: pointer; text-align: right; }
  .item-qty-input { width: 100%; background: var(--panel-sub); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 6px 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: right; outline: none; }
  .item-total { font-family: 'JetBrains Mono', monospace; color: var(--gold); font-weight: 700; text-align: right; }
  .item-edit-input { width: 100%; background: var(--bg); border: 1px solid var(--gold); border-radius: 6px; color: var(--text); padding: 4px 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: right; }
  .item-name-input { width: 100%; background: var(--bg); border: 1px solid var(--gold); border-radius: 6px; color: var(--text); padding: 4px 6px; font-size: 13px; }
  .add-item-btn { width: 100%; margin-top: 12px; background: transparent; border: 1px dashed var(--border); color: var(--text-muted); border-radius: var(--radius-sm); padding: 10px 0; cursor: pointer; font-size: 12.5px; }

  /* 모달 & 에러바 */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal { background: var(--panel-sub); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; width: 100%; max-width: 320px; max-height: 85vh; overflow-y: auto; }
  .modal-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .modal-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); padding: 10px 12px; font-size: 15px; font-family: 'JetBrains Mono', monospace; margin-bottom: 14px; outline: none; }
  .modal-row { display: flex; gap: 10px; justify-content: flex-end; }
  .ghost-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: var(--radius-sm); padding: 8px 14px; cursor: pointer; font-size: 13px; }
  .gold-btn { background: var(--gold); border: none; color: #090a0f; font-weight: 700; border-radius: var(--radius-sm); padding: 8px 16px; cursor: pointer; font-size: 13px; }
  .error-bar { background: rgba(251, 113, 133, 0.15); border: 1px solid var(--rust); color: var(--text); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; }
  .sync-msg { background: rgba(52, 211, 153, 0.12); border: 1px solid var(--green); color: var(--text); padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; }
  .footer-note { text-align: center; font-size: 11.5px; color: var(--text-muted); margin-top: 32px; line-height: 1.6; }

<body>
<div id="app"></div>
<input id="import-file-input" type="file" accept="application/json" style="display:none" onchange="__gl.handleImportFile(event)">
<input id="portrait-file-input" type="file" accept="application/json" style="display:none" onchange="__gl.handlePortraitImport(event)">

<script>
(function () {
  "use strict";

  var STORAGE_PREFIX = "lag_";
  var DEFAULT_TARGET = 0;
  var DEFAULT_RATE = 1000;
  var DEFAULT_ACCOUNTS = [
    { id: "a1", name: "계정 1" },
    { id: "a2", name: "계정 2" },
    { id: "a3", name: "계정 3" },
    { id: "a4", name: "계정 4" }
  ];

  // ---------- 유틸 ----------
  function computeWeekStart(date) {
    var d = new Date(date);
    d.setHours(0, 0, 0, 0);
    var day = d.getDay();
    var diff = (day - 3 + 7) % 7;
    d.setDate(d.getDate() - diff);
    return d;
  }
  function addDays(date, n) {
    var d = new Date(date);
    d.setDate(d.getDate() + n);
    return d;
  }
  function fmtKey(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, "0");
    var d = String(date.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }
  function fmtShort(date) {
    return (date.getMonth() + 1) + "/" + date.getDate() + "(" + "일월화수목금토"[date.getDay()] + ")";
  }
  function fmtNum(n) {
    return Math.round(n || 0).toLocaleString("ko-KR");
  }
  function fmtWalletGold(n) {
    return fmtGold(n).replace(/만$/, '<span class="wallet-unit">만</span>');
  }
  function fmtGold(n) {
    var v = (n || 0) / 10000;
    var s = v.toFixed(4).replace(/\.?0+$/, "");
    if (s === "" || s === "-") s = "0";
    return s + "만";
  }
  function parseManInput(str) {
    if (!str) return 0;
    var normalized = String(str).replace(/[０-９]/g, function (ch) {
      return String.fromCharCode(ch.charCodeAt(0) - 0xfee0);
    });
    var cleaned = normalized.replace(/[^0-9.]/g, "");
    if (!cleaned) return 0;
    var val = parseFloat(cleaned);
    if (isNaN(val)) return 0;
    return Math.round(val * 10000);
  }
  function parseGoldInput(text, signed) {
    var value = String(text == null ? "" : text).trim().replace(/[０-９]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0xfee0); });
    var pattern = signed ? /^-?(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d{1,4})?$/ : /^(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d{1,4})?$/;
    if (!pattern.test(value)) return null;
    var gold = Math.round(Number(value.replace(/,/g, "")) * 10000);
    return Number.isSafeInteger(gold) ? gold : null;
  }
  function manValueForInput(n) {
    var v = (n || 0) / 10000;
    var s = v.toFixed(4).replace(/\.?0+$/, "");
    if (s === "" || s === "-") s = "0";
    return s;
  }
  function parseIntInput(str) {
    if (!str) return 0;
    var normalized = String(str).replace(/[０-９]/g, function (ch) {
      return String.fromCharCode(ch.charCodeAt(0) - 0xfee0);
    });
    var digits = normalized.replace(/[^0-9]/g, "");
    return digits ? parseInt(digits, 10) : 0;
  }
  function validatedWholeInput(el, positive) {
    if (!el) return null;
    var text = el.value.trim(), n = Number(text.replace(/,/g, ""));
    if (!/^(?:\d+|\d{1,3}(?:,\d{3})+)$/.test(text) || !Number.isSafeInteger(n) || n < (positive ? 1 : 0)) {
      el.setCustomValidity(positive ? "0보다 큰 정수를 입력해주세요." : "0 이상의 정수를 입력해주세요."); el.reportValidity(); return null;
    }
    el.setCustomValidity(""); return n;
  }
  function fmtWon(n) {
    return Math.round(n || 0).toLocaleString("ko-KR") + "원";
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------- localStorage ----------
  var storageReady = false, storageSnapshot = "", storageNotice = "";
  var ledgerUndo = [], ledgerNotice = "", saleAccount = "", saleDraft = "";
  function storageFingerprint() {
    return JSON.stringify(Object.keys(localStorage).filter(function (k) { return k.indexOf(STORAGE_PREFIX) === 0; }).sort().map(function (k) { return [k, localStorage.getItem(k)]; }));
  }
  function refreshAfterConflict(message) {
    storageReady = false;
    itemEdit = null; itemUndo = null; ledgerNotice = ""; saleDraft = "";
    state.editingCarriedAccountId = null; state.editingTarget = false; state.editingEntryId = null;
    state.editingCardBill = false; state.editingCash = false;
    storageNotice = message;
    init();
  }
  function withStorageLock(action) {
    var run = function () {
      if (storageReady && storageFingerprint() !== storageSnapshot) {
        refreshAfterConflict("다른 탭에서 기록이 변경되어 최신 내용을 불러왔습니다. 이번 입력은 저장하지 않았습니다. 확인 후 다시 입력해주세요.");
        return;
      }
      if (storageReady && fmtKey(computeWeekStart(new Date())) !== state.weekKey) {
        refreshAfterConflict("새 주차가 시작되어 이월했습니다. 날짜와 보유액을 확인한 뒤 다시 입력해주세요.");
        return;
      }
      try { return action(); } catch (error) {
        refreshAfterConflict(error.message || "저장하지 못했습니다. 기존 기록을 다시 불러왔습니다.");
      }
    };
    // Web Locks serializes read/check/write across tabs on HTTPS (including Pages).
    // Fail closed on unsupported browsers rather than claim collision protection.
    if (!navigator.locks) {
      storageNotice = "안전한 저장을 지원하지 않는 브라우저입니다. 최신 Chrome/Edge에서 HTTPS 사이트를 열어주세요.";
      render(); return Promise.resolve();
    }
    return navigator.locks.request("lostark-ledger-write", run);
  }
  function lsGet(key) {
    try {
      var v = localStorage.getItem(STORAGE_PREFIX + key);
      return v ? JSON.parse(v) : null;
    } catch (e) {
      return null;
    }
  }
  function lsSet(key, val) {
    if (storageReady && storageFingerprint() !== storageSnapshot) throw new Error("다른 탭의 변경을 발견했습니다. 최신 기록을 확인 후 다시 입력해주세요.");
    try {
      localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(val));
      if (storageReady) storageSnapshot = storageFingerprint();
      return true;
    } catch (e) {
      throw new Error("저장 공간이 부족하거나 저장이 차단됐습니다. 변경은 저장되지 않았습니다.");
    }
  }

  // ---------- 상태 ----------
  var state = {
    design: "dashboard",
    view: "ledger",
    accounts: [],
    baseTarget: DEFAULT_TARGET,
    itemTarget: 0,
    weekKey: "",
    weekStart: null,
    weekEnd: null,
    weekTarget: 0,
    weekCarry: 0,
    weekCarriedEarned: 0,
    weekCarriedByAccount: {},
    entries: [],
    history: [],
    filterAccount: "all",
    entryType: "sell",
    exchangeRate: DEFAULT_RATE,
    saleFeePercent: 0,
    rateModalOpen: false,
    cardBill: 0,
    editingCardBill: false,
    cashOnHand: 0,
    editingCash: false,
    sheetUrl: "",
    syncMsg: "",
    lastSheetSyncAt: 0,
    dataModalOpen: false,
    baseModalOpen: false,
    itemPriceApiKey: "",
    itemPriceUpdateInterval: 60,
    itemPriceLastUpdated: 0,
    itemPriceUpdating: false,
    itemPriceError: "",
    editingTarget: false,
    editingCarriedAccountId: null,
    editingItemTarget: false,
    renamingId: null,
    editingEntryId: null,
    showAllHistory: false,
    items: [],
    renamingItemId: null,
    editingItemPriceId: null,
    error: "",
    justCompleted: false
  };

  function totalEarned(entries) {
    return (entries || []).reduce(function (s, e) { return s + (e.type === "sell" ? 0 : e.amount); }, 0);
  }
  function totalSold(entries) {
    return (entries || []).reduce(function (s, e) { return s + (e.type === "sell" ? e.amount : 0); }, 0);
  }
  function effectiveWeekTarget(target, entries) {
    return Math.max(0, (target || 0) - totalSold(entries));
  }
  function totalWeekEarned(carriedEarned, entries) {
    return (carriedEarned || 0) + totalEarned(entries) - totalSold(entries);
  }
  function accountEarned(entries, accId) {
    return (entries || []).filter(function (e) { return e.accountId === accId; })
      .reduce(function (s, e) { return s + (e.type === "sell" ? 0 : e.amount); }, 0);
  }
  function totalAccountEarned(carriedByAccount, entries, accId) {
    var sales = totalSold((entries || []).filter(function (e) { return e.accountId === accId; }));
    return ((carriedByAccount || {})[accId] || 0) + accountEarned(entries, accId) - sales;
  }
  function recordAccountBalance(accountId, balance) {
    var current = totalAccountEarned(state.weekCarriedByAccount, state.entries, accountId);
    var difference = balance - current;
    if (difference === 0) return;
    state.entries = [{
      id: String(Date.now()) + Math.random().toString(16).slice(2, 6),
      accountId: accountId, type: "earn", amount: difference,
      balanceUpdate: true, date: new Date().toISOString()
    }].concat(state.entries);
    saveCurrentWeek();
  }
  function nextCarriedByAccount(carriedByAccount, entries) {
    var result = Object.assign({}, carriedByAccount || {});
    (entries || []).forEach(function (e) {
      result[e.accountId] = (result[e.accountId] || 0) + (e.type === "sell" ? -e.amount : (e.amount || 0));
    });
    return result;
  }

  function loadAccounts() {
    var accs = lsGet("accounts");
    if (!accs || !Array.isArray(accs) || accs.length === 0) {
      accs = DEFAULT_ACCOUNTS.slice();
      lsSet("accounts", accs);
    }
    return accs;
  }
  function loadSettings() {
    var s = lsGet("settings") || {};
    var before = JSON.stringify(s);
    var defaults = { baseTarget: DEFAULT_TARGET, itemTarget: 0, exchangeRate: DEFAULT_RATE, cardBill: 0, cashOnHand: 0, sheetUrl: "", lastSheetSyncAt: 0, itemPriceApiKey: "", itemPriceUpdateInterval: 60, itemPriceLastUpdated: 0 };
    Object.keys(defaults).forEach(function (k) {
      if (s[k] === undefined || s[k] === null) s[k] = defaults[k];
    });
    if (JSON.stringify(s) !== before) lsSet("settings", s);
    return s;
  }
  function getWeek(key) { return lsGet("week_" + key); }
  function setWeek(key, data) { lsSet("week_" + key, data); }

  var DEFAULT_ITEMS = [
    { id: "i1", name: "상급 아비도스 융화 재료", price: 0, qty: 0 },
    { id: "i2", name: "4티어 8레벨 보석", price: 0, qty: 0 }
  ];
  function loadItems() {
    var it = lsGet("items");
    var before = JSON.stringify(it);
    if (!Array.isArray(it)) {
      it = DEFAULT_ITEMS.slice();
    } else {
      // 기존 사용자의 아이템 목록은 그대로 유지하면서 새 계산 대상만 추가
      // 기존에 겁화/작열로 나뉘어 저장된 데이터는 하나의 "4티어 8레벨 보석"으로 통합
      var gemBurn = it.find(function (cur) { return cur.id === "i2" || cur.name === "4티어 8레벨 겁화 보석"; });
      var gemHeat = it.find(function (cur) { return cur.id === "i3" || cur.name === "4티어 8레벨 작열 보석"; });
      if (gemHeat || (gemBurn && gemBurn.name === "4티어 8레벨 겁화 보석")) {

        '<button class="data-btn" onclick="__gl.saveItemPriceApi()">저장 · 즉시 갱신</button></div>' +
        '<div style="font-size:11.5px;color:var(--text-muted)">설정한 주기로 자동 갱신 · ' + esc(formatPriceUpdatedAt(state.itemPriceLastUpdated)) + (state.itemPriceUpdating ? ' · 갱신 중…' : '') + '</div>' +
        (state.itemPriceError ? '<div style="font-size:11.5px;color:var(--rust);margin-top:6px">' + esc(state.itemPriceError) + '</div>' : '') + '</div>';

      html += '<div class="data-section"><div class="data-section-title">백업 (JSON)</div>' +
        '<div class="data-section-desc">계정·기록·설정과 복원한 캐릭터 사진을 저장합니다. API 키는 제외됩니다. 백업에는 개인정보가 있으니 GitHub에 올리지 마세요.</div>' +
        '<div class="data-section-desc">최근 내보내기 요청: ' + (lsGet("backupRequestedAt") ? esc(new Date(lsGet("backupRequestedAt")).toLocaleString("ko-KR")) : '아직 없음') + '<br>다운로드 완료 여부는 다운로드 폴더에서 확인하세요. 가져오기 시 기존 브라우저의 API 키·시트 연결을 유지합니다.</div>' +
        '<div class="data-btn-row"><button class="data-btn" onclick="__gl.exportJSON()">내보내기</button>' +
        '<button class="data-btn" onclick="__gl.triggerImport()">가져오기</button></div></div>';
      html += '<div class="data-section"><div class="data-section-title">캐릭터 사진 복원</div>' +
        '<div class="data-section-desc">이전 HTML에서 추출한 사진 전용 JSON을 불러옵니다. 골드 기록은 유지하고, 사진은 이 브라우저에만 저장합니다.</div>' +
        '<button class="data-btn" onclick="__gl.triggerPortraitImport()">사진 복원 파일 가져오기</button></div>';

      html += '<div class="data-section"><div class="data-section-title">주간 히스토리 CSV</div>' +
        '<div class="data-section-desc">이번 주 포함 전체 주차 기록을 CSV로 내려받아요. 구글 스프레드시트에서 "파일 → 가져오기"로 열 수 있어요.</div>' +
        '<div class="data-btn-row"><button class="data-btn" onclick="__gl.exportCSV()">CSV 내려받기</button></div></div>';

      html += '<div class="data-section"><div class="data-section-title">구글 시트 자동 동기화</div>' +
        '<div class="data-section-desc">구글 시트에 연결된 Apps Script 웹앱 URL을 입력하면, 주간 기록·계정별 획득·개별 내역·아이템·카드값까지 저장할 때마다 자동으로 시트에 반영돼요.</div>' +
        '<input id="sheet-url-input" class="modal-input" placeholder="https://script.google.com/macros/s/.../exec" value="' + esc(state.sheetUrl) + '" />' +
        '<div class="data-section-desc">마지막 저장 확인: ' + fmtSheetSyncTime(state.lastSheetSyncAt) + '</div>' +
        '<div class="data-btn-row"><button class="data-btn" onclick="__gl.saveSheetUrl()">URL 저장</button>' +
        '<button class="data-btn" onclick="__gl.syncNow()">지금 동기화</button></div></div>';

      html += '<div class="modal-row" style="margin-top:14px"><button class="ghost-btn" onclick="__gl.closeDataModal()">닫기</button></div>';
      html += '</div></div>';
    }

    if (state.view === "ledger") {
      // 계정 칩
      if (state.design === "dashboard") html += '<details class="account-manager"' + (state.renamingId ? ' open' : '') + '><summary>계정 관리 · 내역 필터</summary>';
      html += '<div class="account-row">';
      html += '<div class="chip' + (state.filterAccount === "all" ? " active" : "") + '" onclick="__gl.setFilter(\'all\')">전체</div>';
      state.accounts.forEach(function (a) {
        if (state.renamingId === a.id) {
          html += '<div class="chip active">' +
            '<input id="rename-input" class="rename-input" value="' + esc(a.name) + '" ' +
            'onkeydown="__gl.keyEnter(event, function(){__gl.commitRename(\'' + a.id + '\')})" ' +
            'onblur="__gl.commitRename(\'' + a.id + '\')" />' +
            '</div>';
        } else {
          html += '<div class="chip' + (state.filterAccount === a.id ? " active" : "") + '" onclick="__gl.setFilter(\'' + a.id + '\')" title="더블클릭 또는 ✎ 로 이름 변경">' +
            esc(a.name) +
            '<span class="pencil" onclick="__gl.startRename(\'' + a.id + '\', event)" ondblclick="event.stopPropagation()">✎</span>' +
            '<span class="chip-del" onclick="__gl.deleteAccount(\'' + a.id + '\', event)" title="계정 삭제">×</span>' +
            '</div>';
        }
      });
      html += '<button class="chip-add" onclick="__gl.addAccount()" title="계정 추가">+</button>';
      html += '</div>';

      // 기본목표 모달
      if (state.design === "dashboard") html += '</details>';
      if (state.baseModalOpen) {
        html += '<div class="overlay" onclick="__gl.closeBaseModal()"><div class="modal" onclick="event.stopPropagation()">';
        html += '<div class="modal-title">매주 기본 목표금액 (4계정 합산, 만 단위)</div>';
        html += '<input id="base-input" class="modal-input" value="' + manValueForInput(state.baseTarget) + '" inputmode="decimal" ' +
          'onkeydown="__gl.keyEnter(event, __gl.saveBase)" />';
        html += '<div class="modal-row"><button class="ghost-btn" onclick="__gl.closeBaseModal()">취소</button>' +
          '<button class="gold-btn" onclick="__gl.saveBase()">저장</button></div>';
        html += '</div></div>';
      }

      // 주간 장부 카드
      if (state.design === "dashboard") {
        html += renderDashboard(earned, adjustedTarget, remaining);
      } else {
      html += '<section class="card-panel wallet-summary">';
      html += '<div class="card-header-row"><span class="card-header-label">주간 골드 · ' + state.accounts.length + '개 계정</span>' +
        '<span class="card-header-val">' + fmtShort(state.weekStart) + ' ~ ' + fmtShort(state.weekEnd) + '</span></div>';

      html += '<div class="wallet-total"><div class="wallet-total-label">지금 보유한 골드</div><div class="wallet-total-value">' + fmtWalletGold(earned) + '</div>' +
        '<div class="wallet-meta"><span>주 시작 이월 <b>' + fmtGold(state.weekCarriedEarned) + '</b></span><span>이번 주 판매 <b>' + fmtGold(totalSold(state.entries)) + '</b></span></div></div>';

      html += '<div class="wallet-goals">';
      html += '<div class="stat-box"><div class="stat-label">판매 반영 목표</div>';
      if (state.editingTarget) {
        html += '<input id="target-input" class="inline-input" value="' + manValueForInput(adjustedTarget) + '" inputmode="decimal" ' +
          'onblur="__gl.commitTarget()" onkeydown="__gl.keyEnter(event, __gl.commitTarget)" />';
      } else {
        html += '<div class="stat-value" title="클릭해서 수정" onclick="__gl.startEditTarget()">' + fmtWalletGold(adjustedTarget) + '</div>';
      }
      html += '</div>';
      
      html += '<div class="stat-box"><div class="stat-label">' + (remaining > 0 ? "목표까지 부족" : "목표보다 여유") + '</div>' +
        '<div class="stat-value" style="color:' + (remaining > 0 ? "var(--rust)" : "var(--green)") + '">' + fmtWalletGold(Math.abs(remaining)) + '</div></div>';
      html += '</div>';

      html += '<div class="wallet-progress"><div class="bar-fill" style="width:' + (complete ? 100 : barFillWidth) + '%"></div></div>';
      html += '<div class="wallet-progress-caption"><span>현재 보유액 기준</span><span>' + (complete ? '목표 확보 완료' : pct + '% 확보') + '</span></div></section>';
      html += '<div class="wallet-section-head"><h2>계정별 보유 골드</h2><span>금액을 눌러 현재 보유액으로 수정</span></div>';
      html += '<div class="wallet-accounts">';
      state.accounts.forEach(function (a, index) {
        html += '<div class="wallet-account"><div class="wallet-account-name">' + esc(a.name) + '</div>';
        if (state.editingCarriedAccountId === a.id) {
          html += '<div class="wallet-account-edit"><input id="carried-earned-input" aria-label="' + esc(a.name) + ' 현재 보유 골드 (만 단위)" class="items-target-input" value="' + (totalAccountEarned(state.weekCarriedByAccount, state.entries, a.id) / 10000) + '" inputmode="decimal" oninput="this.setCustomValidity(\'\')" onblur="__gl.commitCarriedEarned()" onkeydown="if(event.key===\'Enter\'){event.preventDefault();__gl.commitCarriedEarned();}else if(event.key===\'Escape\'){event.preventDefault();__gl.cancelEditCarriedEarned();}" /><span>만</span></div>';
        } else {
          html += '<button type="button" class="wallet-account-value" aria-label="' + esc(a.name) + ' 보유액 수정" title="클릭해서 현재 보유 골드 수정" onclick="__gl.startEditCarriedEarned(' + index + ')">' + fmtWalletGold(totalAccountEarned(state.weekCarriedByAccount, state.entries, a.id)) + '</button>';
        }
        html += '<div class="wallet-account-note">주 시작 ' + fmtGold(state.weekCarriedByAccount[a.id] || 0) + ' 이월</div></div>';
      });
      var accountedEarned = state.accounts.reduce(function (sum, a) { return sum + totalAccountEarned(state.weekCarriedByAccount, state.entries, a.id); }, 0);
      if (earned !== accountedEarned) {
        html += '<div class="wallet-account"><div class="wallet-account-name">이월 조정 / 미배정</div><div class="wallet-account-value" style="cursor:default">' + fmtWalletGold(earned - accountedEarned) + '</div></div>';
      }
      html += '</div>';

      // 골드 추가 폼
      html += '<section class="card-panel wallet-sales"><div class="wallet-section-head"><h2>골드 판매</h2><span>이번 주 ' + fmtGold(totalSold(state.entries)) + ' 판매</span></div>';
      html += '<div class="entry-form">';
      html += '<select id="entry-account" class="select-input" aria-label="판매 계정">';
      state.accounts.forEach(function (a) {
        html += '<option value="' + a.id + '">' + esc(a.name) + '</option>';
      });
      html += '</select>';
      html += '<input id="entry-amount" class="amount-input" aria-label="판매 골드 (만 단위)" placeholder="판매 금액 (만 골드)" inputmode="decimal" ' +
        'onkeydown="__gl.keyEnter(event, __gl.addEntry)" />';
      html += '<button class="add-btn" onclick="__gl.addEntry()">판매 기록</button>';
      html += '</div>';
      html += '<div class="unit-hint">판매액은 목표와 선택한 계정의 보유액에서 함께 차감됩니다.</div></section>';

      // 카드값 & 원화 환산 (글씨 크기 확대 및 강조 박스)
      }
      var remainingWon = state.cardBill - state.cashOnHand;
      var remainingGold = state.exchangeRate ? (Math.max(0, remainingWon) / state.exchangeRate) * 10000 : 0;
      html += '<section class="card-panel billing-panel">';
      html += '<div class="card-header-row"><span class="card-header-label">카드값 · 다음달 결제 예정</span></div>';
      html += '<div class="stats-grid">';
      html += '<div class="stat-box"><div class="stat-label">카드값 (원)</div>';
      if (state.editingCardBill) {
        html += '<input id="card-bill-input" class="inline-input" value="' + state.cardBill + '" inputmode="numeric" ' +
          'onblur="__gl.commitCardBill()" onkeydown="__gl.keyEnter(event, __gl.commitCardBill)" />';
      } else {
        html += '<div class="stat-value" title="클릭해서 수정" onclick="__gl.startEditCardBill()">' + fmtWon(state.cardBill) + '</div>';
      }
      html += '</div>';
      html += '<div class="stat-box"><div class="stat-label">현금 (원)</div>';
      if (state.editingCash) {
        html += '<input id="cash-input" class="inline-input" value="' + state.cashOnHand + '" inputmode="numeric" ' +
          'onblur="__gl.commitCash()" onkeydown="__gl.keyEnter(event, __gl.commitCash)" />';
      } else {
        html += '<div class="stat-value" title="클릭해서 수정" onclick="__gl.startEditCash()">' + fmtWon(state.cashOnHand) + '</div>';
      }
      html += '</div>';
      html += '<div class="stat-box"><div class="stat-label">' + (remainingWon > 0 ? "남은금액" : "여유자금") + '</div>' +
        '<div class="stat-value" style="color:' + (remainingWon > 0 ? "var(--rust)" : "var(--green)") + '">' + fmtWon(Math.abs(remainingWon)) + '</div></div>';
      html += '</div>';

      html += '<div class="card-conversion-box">';
      html += '<div class="conversion-label">골드로 환산 (남은금액 기준 필요 골드)</div>';
      html += '<div class="conversion-value">' + fmtGold(remainingGold) + '</div>';
      html += '<div class="rate-hint" onclick="__gl.openRateModal()">환율 1만골드 = ' + fmtWon(state.exchangeRate) + ' (클릭해서 수정)</div>';
      html += '</div>';
      html += '</section>';

      // 내역 리스트
      html += '<section class="entries-section">';
      html += '<div class="section-label">보유액 변경 · 판매 내역 (' + state.entries.length + ')</div>';
      if (state.accounts.length > 1) {
        html += '<div class="filter-row">';
        html += '<button class="filter-chip' + (state.filterAccount === "all" ? " active" : "") + '" onclick="__gl.setFilter(\'all\')">전체</button>';
        state.accounts.forEach(function (a) {
          html += '<button class="filter-chip' + (state.filterAccount === a.id ? " active" : "") + '" onclick="__gl.setFilter(\'' + a.id + '\')">' + esc(a.name) + '</button>';
        });
        html += '</div>';
      }
      if (filteredEntries.length === 0) {
        html += '<div class="empty-row">아직 기록된 골드가 없습니다.</div>';
      } else {
        filteredEntries.forEach(function (en) {
          var d = new Date(en.date);
          var accName = accountsById[en.accountId] ? accountsById[en.accountId].name : "-";
          html += '<div class="entry-row">';
          html += '<div class="entry-date">' + (d.getMonth() + 1) + '/' + d.getDate() + '</div>';
          html += '<div><span class="entry-account-tag">' + esc(accName) + (en.type === "sell" ? " · 판매" : en.balanceUpdate ? " · 보유액 수정" : "") + '</span></div>';
          if (state.editingEntryId === en.id) {
            html += '<input id="entry-edit-input" class="entry-edit-input" value="' + manValueForInput(en.amount) + '" inputmode="decimal" ' +
              'onblur="__gl.commitEditEntry(\'' + en.id + '\')" onkeydown="__gl.keyEnter(event, function(){__gl.commitEditEntry(\'' + en.id + '\')})" />';
          } else {
            var isSell = en.type === "sell";
            html += '<div class="entry-amount' + (isSell ? " sell" : "") + '" title="클릭해서 수정" onclick="__gl.startEditEntry(\'' + en.id + '\')">' +
              (isSell || en.amount < 0 ? "-" : "+") + fmtGold(Math.abs(en.amount)) + '</div>';
          }
          html += '<button class="del-btn" onclick="__gl.deleteEntry(\'' + en.id + '\')" title="삭제">×</button>';
          html += '</div>';
        });
      }
      html += '</section>';

      // 지난 주차 히스토리
      html += '<section class="history-section"><div class="section-label">지난 주차 기록</div>';
      if (state.history.length === 0) {
        html += '<div class="empty-row">지난 기록이 아직 없습니다.</div>';
      } else {
        var visible = state.showAllHistory ? state.history : state.history.slice(0, 6);
        if (state.design === "dashboard") html += '<div class="history-columns" aria-hidden="true"><span>주간 기간</span><span>목표 / 보유 골드</span><span>달성 상태</span></div>';
        visible.forEach(function (w) {
          var historyTarget = effectiveWeekTarget(w.target, w.entries);
          var ok = w.earned >= historyTarget;
          html += '<div class="history-row">';
          html += '<div class="history-period">' + fmtShort(w.start) + ' ~ ' + fmtShort(w.end) + '</div>';
          html += '<div class="history-nums"><span style="color:var(--text-muted)">목표 ' + fmtGold(historyTarget) + '</span>' +
            '<span style="color:var(--gold)">보유 ' + fmtGold(w.earned) + '</span></div>';
          html += '<div class="badge ' + (ok ? "badge-ok" : "badge-miss") + '">' + (ok ? "달성" : ("미달 " + fmtGold(historyTarget - w.earned))) + '</div>';
          html += '</div>';
        });
        if (state.history.length > 6) {
          html += '<button class="more-btn" onclick="__gl.toggleHistory()">' +
            (state.showAllHistory ? "접기" : (state.history.length - 6) + '개 더 보기') + '</button>';
        }
      }
      html += '</section>';

    } else {
      html += renderCalculator();
    }

      if (state.rateModalOpen) {
        html += '<div class="overlay" onclick="__gl.closeRateModal()"><div class="modal" onclick="event.stopPropagation()">';
        html += '<div class="modal-title">골드 환율 (1만골드 당 원)</div>';
        html += '<input id="rate-input" class="modal-input" value="' + state.exchangeRate + '" inputmode="numeric" ' +
          'onkeydown="__gl.keyEnter(event, __gl.saveRate)" />';
        html += '<div class="modal-row"><button class="ghost-btn" onclick="__gl.closeRateModal()">취소</button>' +
          '<button class="gold-btn" onclick="__gl.saveRate()">저장</button></div>';
        html += '</div></div>';
      }


    html += '<div class="footer-note"><div class="app-version">골드 장부 · v' + esc(document.querySelector('meta[name="application-version"]').content) + '</div>이 페이지의 기록은 이 브라우저에만 저장됩니다.<br>같은 브라우저·사이트 주소에 저장됩니다. 다른 기기로 옮길 때는 JSON 백업을 사용하세요.</div>';
    html += '</div>';

    document.getElementById("app").innerHTML = html;
    updateSalePreview();
    updatePlan();
    isRendering = false;
    if (renderQueued) {
      renderQueued = false;
      setTimeout(render, 0);
    }
  }

  ["exportJSON", "exportCSV", "undoLedger", "saveBase", "saveRate", "commitCardBill", "commitCash", "saveItemPriceApi", "saveSheetUrl", "commitCarriedEarned", "commitTarget", "commitRename", "addAccount", "deleteAccount", "addEntry", "deleteEntry", "commitEditEntry", "addItem", "deleteItem", "commitCalc", "undoCalc", "setPriceMode"].forEach(function (name) {
    var action = window.__gl[name];
    window.__gl[name] = function () {
      var args = arguments;
      return withStorageLock(function () { storageNotice = ""; return action.apply(window.__gl, args); });
    };
  });
  window.addEventListener("storage", function (event) {
    if (event.key === null || event.key.indexOf(STORAGE_PREFIX) === 0) {
      var banner = document.getElementById("storage-warning");
      if (!banner) { banner = document.createElement("div"); banner.id = "storage-warning"; banner.className = "error-bar"; banner.setAttribute("role", "status"); document.getElementById("app").prepend(banner); }
      banner.textContent = "다른 탭에서 변경되었습니다. 다음 저장 시 최신 내용을 확인하며, 오래된 입력으로 덮어쓰지 않습니다.";
    }
  });
  init();
  setTimeout(function () { updateItemPrices(false); }, 700);
  setInterval(function () { updateItemPrices(false); }, 60 * 1000);
})();
</script>
</body>
</html>
